    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-circleplay" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  </defs>
</svg>

<div id="app" data-view="list">

  <!-- ============================== SIDEBAR ============================== -->
  <aside id="sidebar" aria-label="Your library">
    <div class="brand">
      <a class="logo" id="logo" href="#" aria-label="Rishit’s Stereo — home">
        <span class="logo-ring" aria-hidden="true"></span>
        <span class="logo-name">Rishit’s</span>
        <span class="logo-sub">Stereo</span>
      </a>
      <button class="panel-btn sb-close" id="sbClose" type="button" aria-label="Close sidebar">
        <svg class="ico"><use href="#i-panel"/></svg>
      </button>
    </div>

    <nav class="nav" aria-label="Collections">
      <p class="nav-label">YOUR LIBRARY</p>
      <ul id="nav">
        <li><button type="button" class="nav-item" data-col="all"><svg class="ico i-s"><use href="#i-music"/></svg><span>All Tracks</span></button></li>
        <li><button type="button" class="nav-item" data-col="phonk"><svg class="ico i-s"><use href="#i-circleplay"/></svg><span>Phonk</span></button></li>
        <li><button type="button" class="nav-item" data-col="english"><svg class="ico i-s"><use href="#i-circleplay"/></svg><span>English &amp; Other</span></button></li>
        <li><button type="button" class="nav-item" data-col="hindi"><svg class="ico i-s"><use href="#i-circleplay"/></svg><span>Hindi/Gujarati</span></button></li>
        <li><button type="button" class="nav-item" data-col="instrumental"><svg class="ico i-s"><use href="#i-circleplay"/></svg><span>Instrumental</span></button></li>
        <li><button type="button" class="nav-item" data-col="devotional"><svg class="ico i-s"><use href="#i-circleplay"/></svg><span>Devotional</span></button></li>
        <li><button type="button" class="nav-item" data-col="recent"><svg class="ico i-s"><use href="#i-circleplay"/></svg><span>Recently Played</span></button></li>
        <li><button type="button" class="nav-item" data-col="liked"><svg class="ico i-s"><use href="#i-heart"/></svg><span>Liked Songs</span></button></li>
        <li><button type="button" class="nav-item" data-col="np"><svg class="ico i-s"><use href="#i-play"/></svg><span>Now Playing</span></button></li>
      </ul>
      <button type="button" class="add-btn" id="addBtn"><svg class="ico"><use href="#i-plus"/></svg><span>Add song</span></button>
    </nav>
  </aside>
  <div id="backdrop" aria-hidden="true"></div>

  <!-- =============================== TOP BAR ============================== -->
  <header id="topbar">
    <button class="panel-btn sb-open" id="sbOpen" type="button" aria-label="Open sidebar">
      <svg class="ico"><use href="#i-panel"/></svg>
    </button>
    <label class="search">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search your library..." autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search your library">
    </label>
    <button class="circle-btn theme-btn" id="themeBtn" type="button" aria-label="Switch theme">
      <svg class="ico t-sun"><use href="#i-sun"/></svg>
      <svg class="ico t-moon"><use href="#i-moon"/></svg>
    </button>
    <div class="avatar" aria-hidden="true">RM</div>
  </header>

  <!-- ================================ MAIN ================================ -->
  <main id="main">

    <!-- ---------- song list ---------- -->
    <section id="listView" class="view" aria-label="Songs">
      <div class="coll-head col">
        <p class="coll-label">COLLECTION</p>
        <h1 class="coll-title" id="collTitle">All Tracks</h1>
      </div>
      <div id="listScroll" class="list-scroll">
        <ol id="list" class="list col"></ol>
        <p id="empty" class="empty" hidden></p>
      </div>
    </section>

    <!-- ---------- now playing ---------- -->
    <section id="npView" class="view" aria-label="Now playing" hidden>
      <div class="np-scroll">
        <div class="np-top">
          <button class="circle-btn" id="npBack" type="button" aria-label="Back"><svg class="ico i-chev"><use href="#i-chev"/></svg></button>
          <span class="np-label">NOW PLAYING</span>
          <div class="np-actions">
            <button class="circle-btn" id="npDelete" type="button" aria-label="Remove this song" hidden><svg class="ico i-act"><use href="#i-trash"/></svg></button>
            <button class="circle-btn" id="npShare" type="button" aria-label="Share"><svg class="ico i-act"><use href="#i-share"/></svg></button>
            <button class="circle-btn like-btn" id="npLike" type="button" aria-label="Like" aria-pressed="false"><svg class="ico i-act"><use href="#i-heart"/></svg></button>
          </div>
        </div>

        <div class="np-body">
          <div class="np-art"><div class="np-art-img" id="npArt" role="img" aria-label="Album art"></div></div>

          <div class="np-info">
            <p class="listening">LISTENING NOW</p>
            <h2 class="np-title" id="npTitle">—</h2>
            <p class="np-genre" id="npGenre">—</p>

            <div class="np-seek">
              <input class="range seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" data-seek>
            </div>
            <span class="time" id="npTime">0:00</span>

            <div class="np-controls">
              <button type="button" class="ctl ctl-skip" data-act="prev" aria-label="Previous"><svg class="ico"><use href="#i-prev"/></svg></button>
              <button type="button" class="ctl ctl-seek" data-act="rew" aria-label="Back 10 seconds"><svg class="ico"><use href="#i-rew"/></svg></button>
              <button type="button" class="ctl ctl-play" data-act="toggle" aria-label="Play / pause">
                <svg class="ico fill i-pl"><use href="#i-play"/></svg>
                <svg class="ico fill i-pa"><use href="#i-pause"/></svg>
              </button>
              <button type="button" class="ctl ctl-seek" data-act="ff" aria-label="Forward 10 seconds"><svg class="ico"><use href="#i-ff"/></svg></button>
              <button type="button" class="ctl ctl-skip" data-act="next" aria-label="Next"><svg class="ico"><use href="#i-next"/></svg></button>
            </div>

            <div class="np-extra">
              <button type="button" class="ext ext-vol" data-act="mute" aria-label="Mute"><svg class="ico v-on"><use href="#i-vol"/></svg><svg class="ico v-off"><use href="#i-mute"/></svg></button>
              <input class="range vol" type="range" min="0" max="100" value="90" step="1" aria-label="Volume" data-vol>
              <span class="grow"></span>
              <button type="button" class="ext ext-repeat" data-act="repeat" aria-label="Repeat this song" aria-pressed="false"><svg class="ico"><use href="#i-repeat"/></svg></button>
              <button type="button" class="ext ext-timer" data-act="timer" aria-label="Sleep timer"><svg class="ico"><use href="#i-clock"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ============================ BOTTOM PLAYER =========================== -->
  <footer id="player" aria-label="Player">
    <div class="pl-left" data-act="expand" role="button" tabindex="0" aria-label="Open now playing">
      <span class="thumb" id="plThumb"></span>
      <span class="pl-meta"><span class="pl-title" id="plTitle">—</span><span class="pl-genre" id="plGenre">—</span></span>
    </div>

    <div class="pl-center">
      <div class="pl-controls">
        <button type="button" class="ctl ctl-skip" data-act="prev" aria-label="Previous"><svg class="ico"><use href="#i-prev"/></svg></button>
        <button type="button" class="ctl ctl-seek" data-act="rew" aria-label="Back 10 seconds"><svg class="ico"><use href="#i-rew"/></svg></button>
        <button type="button" class="ctl ctl-play" data-act="toggle" aria-label="Play / pause">
          <svg class="ico fill i-pl"><use href="#i-play"/></svg>
          <svg class="ico fill i-pa"><use href="#i-pause"/></svg>
        </button>
        <button type="button" class="ctl ctl-seek" data-act="ff" aria-label="Forward 10 seconds"><svg class="ico"><use href="#i-ff"/></svg></button>
        <button type="button" class="ctl ctl-skip" data-act="next" aria-label="Next"><svg class="ico"><use href="#i-next"/></svg></button>
      </div>
      <span class="time" id="plTime">0:00</span>
      <input class="range seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" data-seek>
    </div>

    <div class="pl-right">
      <button type="button" class="ext ext-repeat" data-act="repeat" aria-label="Repeat this song" aria-pressed="false"><svg class="ico"><use href="#i-repeat"/></svg></button>
      <button type="button" class="ext ext-timer" data-act="timer" aria-label="Sleep timer"><svg class="ico"><use href="#i-clock"/></svg></button>
      <button type="button" class="ext ext-vol" data-act="mute" aria-label="Mute"><svg class="ico v-on"><use href="#i-vol"/></svg><svg class="ico v-off"><use href="#i-mute"/></svg></button>
      <input class="range vol" type="range" min="0" max="100" value="90" step="1" aria-label="Volume" data-vol>
      <button type="button" class="ext ext-expand" data-act="expand" aria-label="Open now playing"><svg class="ico"><use href="#i-expand"/></svg></button>
    </div>
  </footer>
</div>

<!-- ============================ SLEEP TIMER ============================ -->
<div class="modal" id="sleepModal" hidden role="dialog" aria-modal="true" aria-labelledby="sleepTitle">
  <div class="sheet sleep-sheet">
    <button class="x-btn" type="button" data-close aria-label="Close"><svg class="ico"><use href="#i-x"/></svg></button>
    <p class="eyebrow">SLEEP TIMER</p>
    <h2 class="sheet-title" id="sleepTitle">Stop the music after…</h2>

    <div class="sleep-active" id="sleepActive" hidden>
      <span>Stopping in <b id="sleepLeft">00:00:00</b></span>
      <button type="button" id="sleepCancel">Cancel timer</button>
    </div>

    <div class="chips" id="sleepChips">
      <button type="button" class="chip" data-h="1"><b>1</b><span>hour</span></button>
      <button type="button" class="chip" data-h="2"><b>2</b><span>hours</span></button>
      <button type="button" class="chip" data-h="3"><b>3</b><span>hours</span></button>
      <button type="button" class="chip" data-h="5"><b>5</b><span>hours</span></button>
    </div>

    <hr class="sheet-rule">
    <p class="eyebrow">CUSTOM TIME</p>
    <form class="custom" id="sleepForm" autocomplete="off">
      <label class="field"><input id="cHr" type="number" inputmode="numeric" min="0" max="23" placeholder="0" aria-label="Hours"><span>hr</span></label>
      <label class="field"><input id="cMin" type="number" inputmode="numeric" min="0" max="59" placeholder="0" aria-label="Minutes"><span>min</span></label>
      <button class="start-btn" type="submit">Start</button>
    </form>
    <p class="form-note" id="sleepNote" hidden></p>
  </div>
</div>

<!-- ============================== ADD SONG ============================== -->
<div class="modal" id="addModal" hidden role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <div class="sheet add-sheet">
    <button class="x-btn" type="button" data-close aria-label="Close"><svg class="ico"><use href="#i-x"/></svg></button>
    <p class="eyebrow">ADD SONG</p>
    <h2 class="sheet-title" id="addTitle">Where should it go?</h2>

    <div class="file-card" id="fileCard">
      <span class="file-ico"><svg class="ico"><use href="#i-file"/></svg></span>
      <span class="file-txt"><b id="fileName">song.mp3</b><small id="fileMeta"></small></span>
    </div>

    <label class="name-field" id="nameField">
      <span class="eyebrow">SONG NAME</span>
      <input id="songName" type="text" maxlength="80" placeholder="Song name" autocomplete="off">
    </label>

    <p class="eyebrow">CATEGORY</p>
    <div class="cats" id="catChips" role="radiogroup" aria-label="Category">
      <button type="button" class="cat" role="radio" data-cat="phonk" aria-checked="false">Phonk</button>
      <button type="button" class="cat" role="radio" data-cat="english" aria-checked="false">English &amp; Other</button>
      <button type="button" class="cat" role="radio" data-cat="hindi" aria-checked="false">Hindi/Gujarati</button>
      <button type="button" class="cat" role="radio" data-cat="instrumental" aria-checked="false">Instrumental</button>
      <button type="button" class="cat" role="radio" data-cat="devotional" aria-checked="false">Devotional</button>
    </div>

    <div class="sheet-actions">
      <button type="button" class="ghost-btn" data-close>Cancel</button>
      <button type="button" class="start-btn" id="addConfirm">Add to library</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/mpeg,audio/mp3,audio/*,.mp3" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<audio id="audio" preload="metadata" playsinline></audio>

<script src="songs.js"></script>
<script src="script.js"></script>
</body>
</html>
