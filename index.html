<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Rishit's Stereo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Anta&family=Karla:wght@400;500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ID3 tag reader for embedded album art -->
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

<style>
/* ============ THEME VARIABLES ============ */
:root {
  --accent: #abff00;
  --accent-dim: #abff0022;
  --accent-mid: #abff0055;
  --bg: #000000;
  --bg-2: #0a0a0a;
  --surface: #0e0e0e;
  --surface-2: #151515;
  --border: #1f1f1f;
  --text: #ffffff;
  --text-dim: #9a9a9a;
  --text-muted: #6a6a6a;
  --row-active: #abff0015;
  --logo-ring: #abff00;
  --logo-bg: #000000;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}
[data-theme="light"] {
  --accent: #000455;
  --accent-dim: #00045522;
  --accent-mid: #00045555;
  --bg: #ffffff;
  --bg-2: #f4f4ff;
  --surface: #e2e2ff;
  --surface-2: #d8d8ff;
  --border: #c8c8f0;
  --text: #000455;
  --text-dim: #5560a0;
  --text-muted: #8088b8;
  --row-active: #00045515;
  --logo-ring: #000455;
  --logo-bg: #ffffff;
  --shadow: 0 4px 24px rgba(0,4,85,0.12);
}

/* ============ RESET ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'Quicksand', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.25s ease, color 0.25s ease;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-mid); }

/* ============ APP GRID ============ */
.app {
  display: grid;
  grid-template-columns: 255px 1fr;
  grid-template-rows: 70px 1fr 78px;
  grid-template-areas:
    "sidebar topbar"
    "sidebar main"
    "player player";
  height: 100vh;
  width: 100vw;
  background: var(--bg);
}

/* ============ SIDEBAR ============ */
.sidebar {
  grid-area: sidebar;
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 14px 14px;
  overflow-y: auto;
  z-index: 30;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px 18px;
}
.logo-icon {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 2.5px solid var(--logo-ring);
  background: var(--logo-bg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-icon svg { width: 22px; height: 22px; }
.logo-text { line-height: 1; }
.logo-text .brand {
  font-family: 'Anton', sans-serif;
  font-size: 19px;
  color: var(--accent);
  letter-spacing: 0.5px;
}
.logo-text .sub {
  font-family: 'Anta', sans-serif;
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 3px;
  margin-top: 2px;
}
.sidebar-label {
  font-family: 'Karla', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text-dim);
  padding: 8px 8px 12px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 30px;
  font-family: 'Karla', sans-serif;
  font-weight: 500;
  font-size: 14px;
  color: var(--text);
  margin-bottom: 6px;
  transition: background 0.15s ease;
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--accent-dim); }
.nav-item.active {
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
}
[data-theme="light"] .nav-item.active { color: var(--accent); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.add-song-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 14px;
  padding: 11px;
  border-radius: 30px;
  background: var(--accent);
  color: var(--bg);
  font-family: 'Karla', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1px;
  transition: opacity 0.15s;
}
[data-theme="light"] .add-song-btn { color: #fff; }
.add-song-btn:hover { opacity: 0.85; }
.add-song-btn svg { width: 16px; height: 16px; }

/* ============ TOPBAR ============ */
.topbar {
  grid-area: topbar;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 26px;
  z-index: 20;
}
.menu-btn, .theme-btn, .user-badge {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.menu-btn { display: none; }
.menu-btn svg, .theme-btn svg { width: 20px; height: 20px; }
.theme-btn {
  border: 1.5px solid var(--accent);
  color: var(--accent);
}
.theme-btn:hover { background: var(--accent-dim); }
.user-badge {
  background: var(--accent);
  color: var(--bg);
  font-family: 'Karla', sans-serif;
  font-weight: 700;
  font-size: 13px;
}
[data-theme="light"] .user-badge { color: #fff; }
.search-wrap {
  flex: 1;
  max-width: 520px;
  margin: 0 auto;
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 18px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}
.search-input {
  width: 100%;
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 30px;
  padding: 10px 18px 10px 44px;
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  outline: none;
  transition: border-color 0.15s;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); }

/* ============ MAIN ============ */
.main {
  grid-area: main;
  overflow-y: auto;
  padding: 22px 30px 30px;
  background: var(--bg);
}
.collection-label {
  font-family: 'Karla', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.collection-title {
  font-family: 'Anton', sans-serif;
  font-size: 52px;
  line-height: 1;
  color: var(--accent);
  margin-bottom: 22px;
  letter-spacing: 0.5px;
}
.track-list { display: flex; flex-direction: column; gap: 6px; }
.track {
  display: grid;
  grid-template-columns: 44px 48px 1fr 120px 44px 44px;
  align-items: center;
  gap: 14px;
  padding: 8px 14px;
  border-radius: 14px;
  transition: background 0.12s ease;
  cursor: pointer;
}
.track:hover { background: var(--surface); }
.track.active {
  background: var(--row-active);
  border: 1.5px solid var(--accent);
}
.track-num {
  font-family: 'Anta', sans-serif;
  font-size: 15px;
  color: var(--text-dim);
  text-align: center;
}
.track.active .track-num { color: var(--accent); }
.track-art {
  width: 44px; height: 44px;
  border-radius: 8px;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.track-art img { width: 100%; height: 100%; object-fit: cover; }
.track-art svg { width: 20px; height: 20px; color: var(--accent); }
.track-title {
  font-family: 'Anta', sans-serif;
  font-size: 16px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track.active .track-title { color: var(--accent); }
.track-cat {
  font-family: 'Karla', sans-serif;
  font-size: 13px;
  color: var(--text-dim);
  text-align: left;
}
.track-action {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim);
  transition: background 0.15s, color 0.15s;
}
.track-action svg { width: 18px; height: 18px; }
.track-action:hover { color: var(--accent); background: var(--accent-dim); }
.track-action.liked { color: var(--accent); }
.track-action.playing {
  background: var(--accent);
  color: var(--bg);
}
[data-theme="light"] .track-action.playing { color: #fff; }

/* ============ PLAYER BAR ============ */
.player {
  grid-area: player;
  background: var(--bg-2);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 26px;
  gap: 20px;
  z-index: 40;
}
.player-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.player-art {
  width: 48px; height: 48px;
  border-radius: 8px;
  background: var(--surface-2);
  overflow: hidden;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.player-art img { width: 100%; height: 100%; object-fit: cover; }
.player-art svg { width: 22px; height: 22px; color: var(--accent); }
.player-meta { min-width: 0; }
.player-title {
  font-family: 'Anta', sans-serif;
  font-size: 15px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.player-cat {
  font-family: 'Karla', sans-serif;
  font-size: 12px;
  color: var(--text-dim);
}
.player-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 320px;
}
.player-controls {
  display: flex;
  align-items: center;
  gap: 14px;
}
.pc-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  transition: background 0.15s, transform 0.1s;
}
.pc-btn:hover { background: var(--accent-dim); }
.pc-btn:active { transform: scale(0.92); }
.pc-btn svg { width: 20px; height: 20px; }
.play-btn {
  width: 42px; height: 42px;
  background: var(--accent);
  color: var(--bg);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
[data-theme="light"] .play-btn { color: #fff; }
.play-btn:hover { transform: scale(1.05); }
.play-btn svg { width: 18px; height: 18px; }
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 460px;
}
.time {
  font-family: 'Anta', sans-serif;
  font-size: 11px;
  color: var(--text-dim);
  min-width: 32px;
  text-align: center;
}
.seek {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  position: relative;
  cursor: pointer;
}
.seek-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  width: 0%;
  position: relative;
}
.seek-fill::after {
  content: '';
  position: absolute;
  right: -5px; top: 50%;
  transform: translateY(-50%);
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
}
.player-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
}
.vol-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.vol-btn { color: var(--accent); width: 24px; height: 24px; }
.vol-btn svg { width: 18px; height: 18px; }
.vol-slider {
  width: 90px;
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  position: relative;
  cursor: pointer;
}
.vol-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  width: 70%;
  position: relative;
}
.vol-fill::after {
  content: '';
  position: absolute;
  right: -5px; top: 50%;
  transform: translateY(-50%);
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
}
.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  border-radius: 50%;
  transition: background 0.15s;
}
.icon-btn:hover { background: var(--accent-dim); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.on { color: var(--accent); }

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  width: 100%;
  max-width: 440px;
  box-shadow: var(--shadow);
  position: relative;
}
.modal-close {
  position: absolute;
  top: 18px; right: 18px;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--accent-dim); }
.modal-close svg { width: 16px; height: 16px; }
.modal-label {
  font-family: 'Karla', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.modal-title {
  font-family: 'Anton', sans-serif;
  font-size: 28px;
  color: var(--text);
  margin-bottom: 22px;
  letter-spacing: 0.5px;
}
.timer-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 22px;
}
.timer-opt {
  background: var(--surface);
  border: 1.5px solid transparent;
  border-radius: 14px;
  padding: 16px 6px;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.timer-opt:hover { border-color: var(--accent); }
.timer-opt.selected { border-color: var(--accent); background: var(--accent-dim); }
.timer-opt .num {
  font-family: 'Anton', sans-serif;
  font-size: 26px;
  color: var(--text);
  line-height: 1;
}
.timer-opt .unit {
  font-family: 'Karla', sans-serif;
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}
.divider {
  height: 1px;
  background: var(--border);
  margin: 18px 0;
}
.custom-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.custom-input {
  flex: 1;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  color: var(--text);
  font-family: 'Anta', sans-serif;
  font-size: 15px;
  outline: none;
  text-align: center;
}
.custom-input:focus { border-color: var(--accent); }
.custom-input::placeholder { color: var(--text-muted); }
.custom-unit {
  font-family: 'Karla', sans-serif;
  font-size: 13px;
  color: var(--text-dim);
  width: 28px;
}
.start-btn {
  background: var(--accent);
  color: var(--bg);
  font-family: 'Karla', sans-serif;
  font-weight: 700;
  font-size: 15px;
  padding: 14px 28px;
  border-radius: 14px;
  transition: opacity 0.15s;
}
[data-theme="light"] .start-btn { color: #fff; }
.start-btn:hover { opacity: 0.85; }

/* Category modal */
.cat-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cat-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
  font-family: 'Karla', sans-serif;
  font-weight: 500;
  font-size: 14px;
  color: var(--text);
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.cat-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
.cat-btn svg { width: 16px; height: 16px; color: var(--accent); }

/* Toast */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent);
  color: var(--bg);
  font-family: 'Karla', sans-serif;
  font-weight: 700;
  font-size: 14px;
  padding: 12px 24px;
  border-radius: 30px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 300;
}
[data-theme="light"] .toast { color: #fff; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ RESPONSIVE ============ */
@media (max-width: 1023px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 62px 1fr auto;
    grid-template-areas:
      "topbar"
      "main"
      "player";
  }
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 280px;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 100;
    border-right: 1px solid var(--border);
  }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: flex; }
  .topbar { padding: 0 16px; gap: 10px; }
  .search-wrap { max-width: none; }
  .user-badge { display: none; }
  .collection-title { font-size: 44px; }
  .main { padding: 18px 16px 24px; }

  /* Mobile track card layout */
  .track {
    grid-template-columns: 28px 44px 1fr 40px 40px;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 16px;
  }
  .track-cat { display: none; }
  .track-title { font-size: 15px; }
  .track-action { width: 32px; height: 32px; }
  .track-action svg { width: 17px; height: 17px; }

  .player {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
    padding: 8px 14px 10px;
    gap: 6px;
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.4);
  }
  .player-info { justify-content: flex-start; }
  .player-art { width: 42px; height: 42px; }
  .player-title { font-size: 14px; }
  .player-cat { font-size: 11px; }
  .player-center { min-width: 0; width: 100%; }
  .player-controls { gap: 22px; }
  .progress-wrap { max-width: none; }
  .player-right { display: none; }
  .pc-btn { color: var(--text); }
  .play-btn { width: 46px; height: 46px; }
}

@media (max-width: 480px) {
  .collection-title { font-size: 38px; }
  .track { grid-template-columns: 24px 40px 1fr 36px 36px; gap: 8px; padding: 9px 10px; }
  .track-art { width: 40px; height: 40px; }
  .track-num { font-size: 13px; }
  .track-title { font-size: 14px; }
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}
.sidebar-backdrop.show { display: block; }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--logo-ring)">
          <path d="M9 18V5l12-2v13" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="brand">Rishit's</div>
        <div class="sub">STEREO</div>
      </div>
    </div>

    <div class="sidebar-label">YOUR LIBRARY</div>

    <button class="nav-item active" data-view="all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      All Tracks
    </button>
    <button class="nav-item" data-view="phonk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg>
      Phonk

function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}
function saveLiked() { localStorage.setItem('stereo_liked', JSON.stringify([...state.liked])); }
function saveRecent() { localStorage.setItem('stereo_recent', JSON.stringify(state.recent)); }
function makeId(t) { return 'orig-' + t.n; }

/* ============================================================
   INDEXEDDB for user-uploaded songs
   ============================================================ */
const DB_NAME = 'stereo_db';
const DB_STORE = 'songs';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(DB_STORE)) {
        d.createObjectStore(DB_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}
function dbPut(rec) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(rec);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}

async function loadUserTracks() {
  try {
    await openDB();
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    const records = await dbGetAll();
    state.userTracks = records.map(r => ({
      id: r.id,
      title: r.title,
      cat: r.cat,
      url: URL.createObjectURL(r.blob),
      _blob: r.blob,
      _user: true,
    }));
    state.tracks = [...ORIGINAL_TRACKS.map(t => ({ ...t, id: makeId(t) })), ...state.userTracks];
    render();
  } catch (e) {
    console.warn('IndexedDB unavailable:', e);
    state.tracks = ORIGINAL_TRACKS.map(t => ({ ...t, id: makeId(t) }));
  }
}

/* ============================================================
   ALBUM ART EXTRACTION (from ID3 tags)
   ============================================================ */
function extractArt(track) {
  if (state.artCache[track.id]) return;
  if (typeof jsmediatags === 'undefined') return;
  try {
    jsmediatags.read(track.url, {
      onSuccess: tag => {
        const pic = tag.tags.picture;
        if (pic) {
          const blob = new Blob([new Uint8Array(pic.data)], { type: pic.format });
          const reader = new FileReader();
          reader.onload = () => {
            state.artCache[track.id] = reader.result;
            updateArtInDOM(track.id, reader.result);
          };
          reader.readAsDataURL(blob);
        }
      },
      onError: () => {}
    });
  } catch (e) {}
}

function updateArtInDOM(id, dataUrl) {
  const row = trackListEl.querySelector(`[data-id="${id}"] .track-art`);
  if (row) row.innerHTML = `<img src="${dataUrl}" alt="" />`;
  if (state.currentId === id) {
    playerArt.innerHTML = `<img src="${dataUrl}" alt="" />`;
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function getFilteredTracks() {
  let list = state.tracks.slice();
  if (state.view === 'liked') list = list.filter(t => state.liked.has(t.id));
  else if (state.view === 'recent') list = state.recent.map(id => list.find(t => t.id === id)).filter(Boolean);
  else if (state.view === 'nowplaying') list = state.currentId ? list.filter(t => t.id === state.currentId) : [];
  else if (state.view !== 'all') {
    const map = { phonk: 'Phonk', english: 'English', hindi: 'Hindi', instrumental: 'Instrumental', devotional: 'Devotional' };
    list = list.filter(t => t.cat === map[state.view]);
  }
  if (state.query) {
    const q = state.query.toLowerCase();
    list = list.filter(t => t.title.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q));
  }
  return list;
}

function viewTitle() {
  const map = {
    all: 'All Tracks', phonk: 'Phonk', english: 'English & Other',
    hindi: 'Hindi/Gujarati', instrumental: 'Instrumental',
    devotional: 'Devotional', recent: 'Recently Played',
    liked: 'Liked Songs', nowplaying: 'Now Playing'
  };
  return map[state.view] || 'All Tracks';
}

function render() {
  collectionTitleEl.textContent = viewTitle();
  collectionLabelEl.textContent = state.view === 'liked' ? 'COLLECTION' : 'COLLECTION';

  const list = getFilteredTracks();
  trackListEl.innerHTML = '';

  if (!list.length) {
    trackListEl.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-dim);font-family:Karla,sans-serif;">No tracks here yet.</div>`;
    return;
  }

  list.forEach((t, i) => {
    const isActive = state.currentId === t.id;
    const isLiked = state.liked.has(t.id);
    const artSrc = state.artCache[t.id];
    const row = document.createElement('div');
    row.className = 'track' + (isActive ? ' active' : '');
    row.dataset.id = t.id;
    row.innerHTML = `
      <div class="track-num">${String(i + 1).padStart(2, '0')}</div>
      <div class="track-art">${
        artSrc
          ? `<img src="${artSrc}" alt="" />`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`
      }</div>
      <div class="track-title">${t.title}</div>
      <div class="track-cat">${t.cat}</div>
      <button class="track-action like ${isLiked ? 'liked' : ''}" data-like="${t.id}" aria-label="Like">
        <svg viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
      <button class="track-action play ${isActive && state.isPlaying ? 'playing' : ''}" data-play="${t.id}" aria-label="Play">
        ${isActive && state.isPlaying
          ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
          : `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>`}
      </button>
    `;
    row.addEventListener('click', e => {
      if (e.target.closest('[data-like]') || e.target.closest('[data-play]')) return;
      playTrack(t.id);
    });
    trackListEl.appendChild(row);

    if (!artSrc) extractArt(t);
  });
}

/* ============================================================
   PLAYBACK
   ============================================================ */
function playTrack(id) {
  const t = state.tracks.find(x => x.id === id);
  if (!t) return;
  if (state.currentId === id) { togglePlay(); return; }

  state.currentId = id;
  audio.src = t.url;
  audio.play().then(() => {
    state.isPlaying = true;
    updatePlayerUI();
    render();
  }).catch(err => {
    console.warn('Play failed:', err);
    state.isPlaying = false;
    updatePlayerUI();
  });

  // Recent
  state.recent = [id, ...state.recent.filter(x => x !== id)].slice(0, 30);
  saveRecent();
}

function togglePlay() {
  if (!state.currentId) {
    const list = getFilteredTracks();
    if (list.length) playTrack(list[0].id);
    return;
  }
  if (audio.paused) {
    audio.play().then(() => { state.isPlaying = true; updatePlayerUI(); render(); });
  } else {
    audio.pause();
    state.isPlaying = false;
    updatePlayerUI();
    render();
  }
}

function nextTrack() {
  const list = getFilteredTracks();
  if (!list.length) return;
  const idx = list.findIndex(t => t.id === state.currentId);
  const next = list[(idx + 1) % list.length];
  playTrack(next.id);
}
function prevTrack() {
  const list = getFilteredTracks();
  if (!list.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const idx = list.findIndex(t => t.id === state.currentId);
  const prev = list[(idx - 1 + list.length) % list.length];
  playTrack(prev.id);
}

function updatePlayerUI() {
  const t = state.tracks.find(x => x.id === state.currentId);
  if (t) {
    playerTitle.textContent = t.title;
    playerCat.textContent = t.cat;
    const art = state.artCache[t.id];
    playerArt.innerHTML = art
      ? `<img src="${art}" alt="" />`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
  } else {
    playerTitle.textContent = 'No track playing';
    playerCat.textContent = '—';
  }
  playIcon.innerHTML = state.isPlaying
    ? `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    : `<polygon points="6 4 20 12 6 20"/>`;

  const t2 = state.tracks.find(x => x.id === state.currentId);
  if (t2 && !state.artCache[t2.id]) extractArt(t2);
}

/* ============================================================
   AUDIO EVENTS
   ============================================================ */
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  seekFill.style.width = pct + '%';
  curTimeEl.textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => {
  durTimeEl.textContent = fmt(audio.duration);
});
audio.addEventListener('ended', () => {
  if (state.repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
  const list = getFilteredTracks();
  const idx = list.findIndex(t => t.id === state.currentId);
  if (idx < list.length - 1) nextTrack();
  else if (state.repeat === 'all' && list.length) playTrack(list[0].id);
  else { state.isPlaying = false; updatePlayerUI(); render(); }
});

/* ============================================================
   SEEK / VOLUME
   ============================================================ */
seek.addEventListener('click', e => {
  const rect = seek.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (audio.duration) audio.currentTime = pct * audio.duration;
});

function setVolume(v) {
  state.volume = Math.max(0, Math.min(1, v));
  audio.volume = state.muted ? 0 : state.volume;
  volFill.style.width = (state.volume * 100) + '%';
}
volSlider.addEventListener('click', e => {
  const rect = volSlider.getBoundingClientRect();
  setVolume((e.clientX - rect.left) / rect.width);
});
volBtn.addEventListener('click', () => {
  state.muted = !state.muted;
  audio.volume = state.muted ? 0 : state.volume;
  volBtn.style.opacity = state.muted ? '0.4' : '1';
});

/* ============================================================
   CONTROLS
   ============================================================ */
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', nextTrack);
prevBtn.addEventListener('click', prevTrack);
rewBtn.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
fwdBtn.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });

repeatBtn.addEventListener('click', () => {
  const modes = ['off', 'all', 'one'];
  state.repeat = modes[(modes.indexOf(state.repeat) + 1) % 3];
  repeatBtn.classList.toggle('on', state.repeat !== 'off');
  repeatBtn.style.opacity = state.repeat === 'off' ? '0.4' : '1';
  repeatBtn.title = 'Repeat: ' + state.repeat;
  showToast('Repeat: ' + state.repeat);
});

/* ============================================================
   NAV
   ============================================================ */
$$('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.view = btn.dataset.view;
    render();
    if (window.innerWidth < 1024) closeSidebar();
  });
});

searchInput.addEventListener('input', e => {
  state.query = e.target.value.trim();
  render();
});

/* ============================================================
   THEME
   ============================================================ */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('stereo_theme', t);
  themeIcon.innerHTML = t === 'dark'
    ? `<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>`
    : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});
setTheme(localStorage.getItem('stereo_theme') || 'dark');

/* ============================================================
   SIDEBAR (mobile)
   ============================================================ */
function openSidebar() { sidebar.classList.add('open'); sidebarBackdrop.classList.add('show'); }
function closeSidebar() { sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('show'); }
menuBtn.addEventListener('click', openSidebar);
sidebarBackdrop.addEventListener('click', closeSidebar);

/* ============================================================
   MODAL HELPERS
   ============================================================ */
function openModal(id) { $('#' + id).classList.add('open'); }
function closeModal(id) { $('#' + id).classList.remove('open'); }
$$('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
[timerModal, catModal].forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

/* ============================================================
   SLEEP TIMER
   ============================================================ */
timerBtn.addEventListener('click', () => openModal('timerModal'));

$$('.timer-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    $$('.timer-opt').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    customHr.value = '';
    customMin.value = '';
  });
});

timerStart.addEventListener('click', () => {
  let minutes = 0;
  const sel = document.querySelector('.timer-opt.selected');
  if (sel) minutes = parseInt(sel.dataset.min, 10);
  else {
    const h = parseInt(customHr.value || 0, 10);
    const m = parseInt(customMin.value || 0, 10);
    minutes = h * 60 + m;
  }
  if (!minutes || minutes <= 0) { showToast('Choose a time first'); return; }

  if (state.timerId) clearTimeout(state.timerId);
  state.timerEnd = Date.now() + minutes * 60000;
  state.timerId = setTimeout(() => {
    audio.pause();
    state.isPlaying = false;
    updatePlayerUI();
    render();
    showToast('Sleep timer ended — music stopped');
    state.timerId = null;
  }, minutes * 60000);

  showToast(`Sleep timer set for ${minutes} min`);
  closeModal('timerModal');
  $$('.timer-opt').forEach(o => o.classList.remove('selected'));
  customHr.value = ''; customMin.value = '';
});

/* ============================================================
   ADD SONG
   ============================================================ */
let pendingFile = null;

addSongBtn.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/mpeg,audio/mp3,audio/*';
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    pendingFile = f;
    $('#catModalTitle').textContent = f.name.replace(/\.[^.]+$/, '');
    openModal('catModal');
  };
  input.click();
});

$$('#catList .cat-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (!pendingFile) return;
    const cat = btn.dataset.cat;
    const id = 'user-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    const title = pendingFile.name.replace(/\.[^.]+$/, '');
    try {
      await dbPut({ id, title, cat, blob: pendingFile });
      const url = URL.createObjectURL(pendingFile);
      state.userTracks.push({ id, title, cat, url, _blob: pendingFile, _user: true });
      state.tracks = [...ORIGINAL_TRACKS.map(t => ({ ...t, id: makeId(t) })), ...state.userTracks];
      render();
      showToast(`Added "${title}" to ${cat}`);
    } catch (e) {
      console.error(e);
      showToast('Could not save song');
    }
    pendingFile = null;
    closeModal('catModal');
  });
});

/* ============================================================
   LIKE BUTTON (event delegation)
   ============================================================ */
trackListEl.addEventListener('click', e => {
  const likeBtn = e.target.closest('[data-like]');
  if (likeBtn) {
    e.stopPropagation();
    const id = likeBtn.dataset.like;
    if (state.liked.has(id)) state.liked.delete(id);
    else state.liked.add(id);
    saveLiked();
    render();
  }
  const playBtn2 = e.target.closest('[data-play]');
  if (playBtn2) {
    e.stopPropagation();
    const id = playBtn2.dataset.play;
    if (state.currentId === id) togglePlay();
    else playTrack(id);
  }
});

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  if (e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
  if (e.code === 'ArrowUp') { e.preventDefault(); setVolume(state.volume + 0.05); }
  if (e.code === 'ArrowDown') { e.preventDefault(); setVolume(state.volume - 0.05); }
});

/* ============================================================
   INIT
   ============================================================ */
setVolume(state.volume);
repeatBtn.style.opacity = '0.4';
loadUserTracks();
</script>
</body>
</html>
