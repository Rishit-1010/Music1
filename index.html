<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rishit's Stereo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Anta&family=Karla:wght@400;500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#abff00;--accent-dim:#abff0022;--accent-mid:#abff0055;--bg:#000;--bg-2:#0a0a0a;--surface:#0e0e0e;--surface-2:#151515;--border:#1f1f1f;--text:#fff;--text-dim:#9a9a9a;--text-muted:#6a6a6a;--row-active:#abff0015;--logo-ring:#abff00;--logo-bg:#000;--shadow:0 4px 24px rgba(0,0,0,.5)}
[data-theme="light"]{--accent:#000455;--accent-dim:#00045522;--accent-mid:#00045555;--bg:#fff;--bg-2:#f4f4ff;--surface:#e2e2ff;--surface-2:#d8d8ff;--border:#c8c8f0;--text:#000455;--text-dim:#5560a0;--text-muted:#8088b8;--row-active:#00045515;--logo-ring:#000455;--logo-bg:#fff;--shadow:0 4px 24px rgba(0,4,85,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.app{display:grid;grid-template-columns:255px 1fr;grid-template-rows:70px 1fr 78px;grid-template-areas:"sidebar topbar" "sidebar main" "player player";height:100vh;width:100vw}
.sidebar{grid-area:sidebar;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px 14px;overflow-y:auto;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.logo-icon{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--logo-ring);background:var(--logo-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:22px;height:22px}
.logo-text .brand{font-family:'Anton',sans-serif;font-size:19px;color:var(--accent);letter-spacing:.5px}
.logo-text .sub{font-family:'Anta',sans-serif;font-size:12px;color:var(--text-dim);letter-spacing:3px;margin-top:2px}
.sidebar-label{font-family:'Karla',sans-serif;font-weight:700;font-size:11px;letter-spacing:3px;color:var(--text-dim);padding:8px 8px 12px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:30px;font-family:'Karla',sans-serif;font-weight:500;font-size:14px;color:var(--text);margin-bottom:6px;transition:background .15s;text-align:left;width:100%}
.nav-item:hover{background:var(--accent-dim)}
.nav-item.active{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
.add-song-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:11px;border-radius:30px;background:var(--accent);color:var(--bg);font-family:'Karla',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;transition:opacity .15s}
[data-theme="light"] .add-song-btn{color:#fff}
.add-song-btn:hover{opacity:.85}
.topbar{grid-area:topbar;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 26px;z-index:20}
.menu-btn,.theme-btn,.user-badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.menu-btn{display:none}
.menu-btn svg,.theme-btn svg{width:20px;height:20px}
.theme-btn{border:1.5px solid var(--accent);color:var(--accent)}
.theme-btn:hover{background:var(--accent-dim)}
.user-badge{background:var(--accent);color:var(--bg);font-family:'Karla',sans-serif;font-weight:700;font-size:13px}
[data-theme="light"] .user-badge{color:#fff}
.search-wrap{flex:1;max-width:520px;margin:0 auto;position:relative}
.search-wrap svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted);pointer-events:none}
.search-input{width:100%;background:transparent;border:1.5px solid var(--border);border-radius:30px;padding:10px 18px 10px 44px;color:var(--text);font-size:14px;font-weight:500;outline:none;transition:border-color .15s}
.search-input::placeholder{color:var(--text-muted)}
.search-input:focus{border-color:var(--accent)}
.main{grid-area:main;overflow-y:auto;padding:22px 30px 30px;background:var(--bg)}
.collection-label{font-family:'Karla',sans-serif;font-weight:700;font-size:11px;letter-spacing:4px;color:var(--text-dim);margin-bottom:4px}
.collection-title{font-family:'Anton',sans-serif;font-size:52px;line-height:1;color:var(--accent);margin-bottom:22px;letter-spacing:.5px}
.track-list{display:flex;flex-direction:column;gap:6px}
.track{display:grid;grid-template-columns:44px 48px 1fr 120px 44px 44px;align-items:center;gap:14px;padding:8px 14px;border-radius:14px;transition:background .12s;cursor:pointer}
.track:hover{background:var(--surface)}
.track.active{background:var(--row-active);border:1.5px solid var(--accent)}
.track-num{font-family:'Anta',sans-serif;font-size:15px;color:var(--text-dim);text-align:center}
.track.active .track-num{color:var(--accent)}
.track-art{width:44px;height:44px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.track-art svg{width:20px;height:20px;color:var(--accent)}
.track-title{font-family:'Anta',sans-serif;font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.active .track-title{color:var(--accent)}
.track-cat{font-family:'Karla',sans-serif;font-size:13px;color:var(--text-dim)}
.track-action{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:background .15s,color .15s}
.track-action svg{width:18px;height:18px}
.track-action:hover{color:var(--accent);background:var(--accent-dim)}
.track-action.liked{color:var(--accent)}
.track-action.playing{background:var(--accent);color:var(--bg)}
[data-theme="light"] .track-action.playing{color:#fff}
.player{grid-area:player;background:var(--bg-2);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 26px;gap:20px;z-index:40}
.player-info{display:flex;align-items:center;gap:12px;min-width:0}
.player-art{width:48px;height:48px;border-radius:8px;background:var(--surface-2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.player-art svg{width:22px;height:22px;color:var(--accent)}
.player-title{font-family:'Anta',sans-serif;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-cat{font-family:'Karla',sans-serif;font-size:12px;color:var(--text-dim)}
.player-center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:320px}
.player-controls{display:flex;align-items:center;gap:14px}
.pc-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);transition:background .15s,transform .1s}
.pc-btn:hover{background:var(--accent-dim)}
.pc-btn:active{transform:scale(.92)}
.pc-btn svg{width:20px;height:20px}
.play-btn{width:42px;height:42px;background:var(--accent);color:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .1s}
[data-theme="light"] .play-btn{color:#fff}
.play-btn:hover{transform:scale(1.05)}
.play-btn svg{width:18px;height:18px}
.progress-wrap{display:flex;align-items:center;gap:10px;width:100%;max-width:460px}
.time{font-family:'Anta',sans-serif;font-size:11px;color:var(--text-dim);min-width:32px;text-align:center}
.seek{flex:1;height:4px;background:var(--border);border-radius:4px;position:relative;cursor:pointer}
.seek-fill{height:100%;background:var(--accent);border-radius:4px;width:0;position:relative}
.seek-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:var(--accent)}
.player-right{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.vol-wrap{display:flex;align-items:center;gap:8px}
.vol-btn{color:var(--accent);width:24px;height:24px}
.vol-btn svg{width:18px;height:18px}
.vol-slider{width:90px;height:4px;background:var(--border);border-radius:4px;position:relative;cursor:pointer}
.vol-fill{height:100%;background:var(--accent);border-radius:4px;width:70%;position:relative}
.vol-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:var(--accent)}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--accent);border-radius:50%;transition:background .15s}
.icon-btn:hover{background:var(--accent-dim)}
.icon-btn svg{width:18px;height:18px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:440px;box-shadow:var(--shadow);position:relative}
.modal-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--accent-dim)}
.modal-close svg{width:16px;height:16px}
.modal-label{font-family:'Karla',sans-serif;font-weight:700;font-size:11px;letter-spacing:3px;color:var(--text-dim);margin-bottom:8px}
.modal-title{font-family:'Anton',sans-serif;font-size:28px;color:var(--text);margin-bottom:22px;letter-spacing:.5px}
.timer-options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.timer-opt{background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:16px 6px;text-align:center;transition:border-color .15s,background .15s}
.timer-opt:hover{border-color:var(--accent)}
.timer-opt.selected{border-color:var(--accent);background:var(--accent-dim)}
.timer-opt .num{font-family:'Anton',sans-serif;font-size:26px;color:var(--text);line-height:1}
.timer-opt .unit{font-family:'Karla',sans-serif;font-size:11px;color:var(--text-dim);margin-top:4px}
.divider{height:1px;background:var(--border);margin:18px 0}
.custom-row{display:flex;align-items:center;gap:10px}
.custom-input{flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-family:'Anta',sans-serif;font-size:15px;outline:none;text-align:center}
.custom-input:focus{border-color:var(--accent)}
.custom-unit{font-family:'Karla',sans-serif;font-size:13px;color:var(--text-dim);width:28px}
.start-btn{background:var(--accent);color:var(--bg);font-family:'Karla',sans-serif;font-weight:700;font-size:15px;padding:14px 28px;border-radius:14px;transition:opacity .15s}
[data-theme="light"] .start-btn{color:#fff}
.start-btn:hover{opacity:.85}
.cat-list{display:flex;flex-direction:column;gap:8px}
.cat-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 18px;font-family:'Karla',sans-serif;font-weight:500;font-size:14px;color:var(--text);text-align:left;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:12px}
.cat-btn:hover{border-color:var(--accent);background:var(--accent-dim)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--bg);font-family:'Karla',sans-serif;font-weight:700;font-size:14px;padding:12px 24px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:300}
[data-theme="light"] .toast{color:#fff}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.sidebar-backdrop.show{display:block}
@media (max-width:1023px){
  .app{grid-template-columns:1fr;grid-template-rows:62px 1fr auto;grid-template-areas:"topbar" "main" "player"}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .25s;z-index:100;border-right:1px solid var(--border)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .topbar{padding:0 16px;gap:10px}
  .search-wrap{max-width:none}
  .user-badge{display:none}
  .collection-title{font-size:44px}
  .main{padding:18px 16px 24px}
  .track{grid-template-columns:28px 44px 1fr 40px 40px;gap:10px;padding:10px 12px;border-radius:16px}
  .track-cat{display:none}
  .track-title{font-size:15px}
  .track-action{width:32px;height:32px}
  .track-action svg{width:17px;height:17px}
  .player{grid-template-columns:1fr;grid-template-rows:auto auto;padding:8px 14px 10px;gap:6px}
  .player-art{width:42px;height:42px}
  .player-title{font-size:14px}
  .player-cat{font-size:11px}
  .player-center{min-width:0;width:100%}
  .player-controls{gap:22px}
  .progress-wrap{max-width:none}
  .player-right{display:none}
  .pc-btn{color:var(--text)}
  .play-btn{width:46px;height:46px}
}
@media (max-width:480px){
  .collection-title{font-size:38px}
  .track{grid-template-columns:24px 40px 1fr 36px 36px;gap:8px;padding:9px 10px}
  .track-art{width:40px;height:40px}
  .track-num{font-size:13px}
  .track-title{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--logo-ring)"><path d="M9 18V5l12-2v13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="logo-text"><div class="brand">Rishit's</div><div class="sub">STEREO</div></div>
    </div>
    <div class="sidebar-label">YOUR LIBRARY</div>
    <button class="nav-item active" data-view="all">All Tracks</button>
    <button class="nav-item" data-view="phonk">Phonk</button>
    <button class="nav-item" data-view="english">English &amp; Other</button>
    <button class="nav-item" data-view="hindi">Hindi/Gujarati</button>
    <button class="nav-item" data-view="instrumental">Instrumental</button>
    <button class="nav-item" data-view="devotional">Devotional</button>
    <button class="nav-item" data-view="recent">Recently Played</button>
    <button class="nav-item" data-view="liked">Liked Songs</button>
    <button class="nav-item" data-view="nowplaying">Now Playing</button>
    <button class="add-song-btn" id="addSongBtn">+ ADD SONG</button>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Search your library..." />
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg></button>
    <div class="user-badge">RM</div>
  </header>
  <main class="main" id="main">
    <div class="collection-label">COLLECTION</div>
    <h1 class="collection-title" id="collectionTitle">All Tracks</h1>
    <div class="track-list" id="trackList"></div>
  </main>
  <footer class="player">
    <div class="player-info">
      <div class="player-art" id="playerArt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div class="player-meta"><div class="player-title" id="playerTitle">No track playing</div><div class="player-cat" id="playerCat">—</div></div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="pc-btn" id="prevBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
        <button class="pc-btn" id="rewBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg></button>
        <button class="play-btn" id="playBtn"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg></button>
        <button class="pc-btn" id="fwdBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg></button>
        <button class="pc-btn" id="nextBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
      </div>
      <div class="progress-wrap">
        <span class="time" id="curTime">0:00</span>
        <div class="seek" id="seek"><div class="seek-fill" id="seekFill"></div></div>
        <span class="time" id="durTime">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <div class="vol-wrap">
        <button class="vol-btn" id="volBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
        <div class="vol-slider" id="volSlider"><div class="vol-fill" id="volFill"></div></div>
      </div>
      <button class="icon-btn" id="repeatBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      <button class="icon-btn" id="timerBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
    </div>
  </footer>
</div>

<div class="modal-overlay" id="timerModal">
  <div class="modal">
    <button class="modal-close" data-close="timerModal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="modal-label">SLEEP TIMER</div>
    <div class="modal-title">Stop the music after...</div>
    <div class="timer-options">
      <button class="timer-opt" data-min="60"><div class="num">1</div><div class="unit">hour</div></button>
      <button class="timer-opt" data-min="120"><div class="num">2</div><div class="unit">hours</div></button>
      <button class="timer-opt" data-min="180"><div class="num">3</div><div class="unit">hours</div></button>
      <button class="timer-opt" data-min="300"><div class="num">5</div><div class="unit">hours</div></button>
    </div>
    <div class="divider"></div>
    <div class="modal-label">CUSTOM TIME</div>
    <div class="custom-row">
      <input class="custom-input" id="customHr" type="number" min="0" placeholder="0" />
      <span class="custom-unit">hr</span>
      <input class="custom-input" id="customMin" type="number" min="0" max="59" placeholder="0" />
      <span class="custom-unit">min</span>
      <button class="start-btn" id="timerStart">Start</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="catModal">
  <div class="modal">
    <button class="modal-close" data-close="catModal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="modal-label">ADD TO LIBRARY</div>
    <div class="modal-title" id="catModalTitle">Choose a category</div>
